---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: bottlerocket@latest
  role: k8s-kira-demo-dev-karpenter-node-role # Set the existing IAM Role for Karpenter nodes
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: k8s-kira-demo-dev # Set EKS cluster name
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: k8s-kira-demo-dev # Set EKS cluster name
  tags:
    karpenter.sh/discovery: k8s-kira-demo-dev # Set EKS cluster name
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values: ["t3.medium"]
        - key: "topology.kubernetes.io/zone"
          operator: In
          values: ["us-east-1a", "us-east-1b"]
        # - key: "karpenter.k8s.aws/instance-category"
        #   operator: In
        #   values: ["c", "m", "r"]
        # - key: "karpenter.k8s.aws/instance-cpu"
        #   operator: In
        #   values: ["4", "8", "16", "32"]
        # - key: "karpenter.k8s.aws/instance-hypervisor"
        #   operator: In
        #   values: ["nitro"]
        # - key: "karpenter.k8s.aws/instance-generation"
        #   operator: Gt
        #   values: ["2"]
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
